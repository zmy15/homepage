<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page not found</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #1a1b26;
        color: #c0caf5;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        background-image: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(122,162,247,.13), transparent 60%);
      }
      .box { text-align: center; padding: 2rem; }
      .code {
        font-size: clamp(4rem, 18vw, 9rem);
        font-weight: 800;
        line-height: 1;
        background: linear-gradient(90deg, #7aa2f7, #7dcfff, #bb9af7);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p { color: #565f89; margin: 1rem 0 2rem; font-size: .95rem; }
      a {
        display: inline-block;
        padding: .75rem 1.5rem;
        border-radius: .75rem;
        background: #7aa2f7;
        color: #1a1b26;
        text-decoration: none;
        font-weight: 700;
        font-size: .875rem;
        transition: background .2s;
      }
      a:hover { background: #7dcfff; }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="code">404</div>
      <p>This page doesn't exist.</p>
      <a href="/">← Back home</a>
    </div>
  </body>
</html>
